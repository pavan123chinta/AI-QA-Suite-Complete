[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v -ra --tb=short --strict-markers
markers =
    api: API automation tests
    ui: Playwright UI automation tests
    ai: AI feature tests (generation, analysis, self-healing)
    smoke: Quick sanity / smoke tests
    regression: Full regression test suite
    negative: Negative test scenarios
    self_healing: Self-healing locator tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
