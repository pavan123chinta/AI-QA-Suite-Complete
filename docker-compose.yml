version: '3.8'

services:
  ai-qa-suite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_qa_suite_runner
    environment:
      - ENVIRONMENT=docker
      - AI_PROVIDER=mock
      - HEADLESS=true
      - BASE_URL=http://127.0.0.1:8765
      - API_BASE_URL=https://jsonplaceholder.typicode.com
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    command: ["python", "-m", "pytest", "--html=reports/report.html", "--self-contained-html"]
