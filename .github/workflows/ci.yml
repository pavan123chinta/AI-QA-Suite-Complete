name: AI-QA-Suite CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run AI-QA-Suite Automation Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & System Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Pytest Suite with HTML Reporting
        env:
          ENVIRONMENT: ci
          AI_PROVIDER: mock
          HEADLESS: true
          BASE_URL: http://127.0.0.1:8765
          API_BASE_URL: https://jsonplaceholder.typicode.com
        run: |
          python -m pytest --html=reports/report.html --self-contained-html

      - name: Upload Test Execution Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-execution-report
          path: |
            reports/
            logs/
          retention-days: 14
